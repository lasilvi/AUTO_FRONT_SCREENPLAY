webdriver {
  driver = chrome
}

chrome {
  switches = "--start-maximized"
}

serenity {
  project.name = "Restaurant App"
}

webdriver.base.url = "http://localhost:8080"

serenity.take.screenshots = FOR_EACH_ACTION

serenity{
  encoding = "UTF-8"
  reports.encoding = "UTF-8"
  compressed.reports = true
  take.screenshots = FOR_EACH_ACTION
}